repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: debug-statements
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.1
    hooks:
      - id: ruff
        args: [--fix, --show-fixes, --preview]
        types_or: [python, pyi, jupyter]

      - id: ruff-format
        types_or: [python, pyi, jupyter]

  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt (client)
        entry: client/node_modules/.bin/oxfmt
        language: system
        files: ^client/
        exclude: (pnpm-lock\.yaml|routeTree\.gen\.ts)$
        types_or: [javascript, jsx, ts, tsx, json, yaml, css, markdown]

      - id: oxlint
        name: oxlint (client)
        entry: client/node_modules/.bin/oxlint
        language: system
        files: ^client/
        exclude: routeTree\.gen\.ts$
        types_or: [javascript, jsx, ts, tsx]
